services:
  # Cliente web: o Voz inteiro. Nao ha backend; as mensagens vao do navegador aos relays.
  web:
    build:
      context: ./web
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/web/src          # hot-reload em desenvolvimento
      - ./web/public:/app/web/public
